[package]
name = "localagentmanager-core"
version = "0.3.6"
edition = "2021"
build = "build.rs"
default-run = "localagentmanager"

[lib]
name = "localagentmanager_core"
path = "src/lib.rs"

[[bin]]
name = "lam-core"
path = "src/bin/lam-core.rs"

[[bin]]
name = "localagentmanager"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.1"
# Remote Provider Gateway dependencies
tokio = { version = "1", features = ["rt", "net", "sync", "macros", "time", "io-util", "signal"] }
futures = "0.3"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
toml = "0.8"
toml_edit = "0.22"
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
rand = "0.8"
libc = "0.2"
url = "2"
http = "1"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-quartz-core = "0.3.2"
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[build-dependencies]
image = "0.25"
tauri-build = { version = "2", features = [] }
