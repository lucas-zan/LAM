# Codex behavior defaults for LAM-managed API Account profiles.
#
# This template intentionally contains no model, Provider, authentication,
# project, path, command, MCP, plugin, hook, session, or machine identity data.
# LAM applies account-specific model routing after writing this file.

model_reasoning_effort = "medium"
personality = "pragmatic"
service_tier = "default"
approvals_reviewer = "user"

[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]

[features]
multi_agent = true
js_repl = false
